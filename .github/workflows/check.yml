name: Syntax check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript
        run: |
          node --check js/logo-data.js
          node --check js/main.js
          node --check js/works.js
          node --check js/components/circular-carousel.js
